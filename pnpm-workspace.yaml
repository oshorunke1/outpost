# TypeScript packages. backend arrived in M2. mcp, evals/runner and tools/outpost-cli arrive in M3.
# contracts/ holds generated files only until M3 gives it a package.json. pnpm skips folders that are not packages yet.
packages:
  - backend
  - mcp
  - contracts
  - evals/runner
  - tools/outpost-cli
onlyBuiltDependencies:
  - esbuild
