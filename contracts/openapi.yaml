  /v1/telemetry/batch:
    post:
      operationId: submitTelemetryBatch
      summary: Queue up to 500 gameplay and health events. Answers before any database
        work.
      tags:
        - telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  minItems: 1
                  maxItems: 500
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        enum:
                          - player_join
                          - player_leave
                          - orb_collected
                          - earn_flush
                          - purchase_result
                          - breaker_state
                          - netguard_drop
                      ts:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                        maximum: 9007199254740991
                      userId:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                        maximum: 9007199254740991
                      value:
                        type: number
                        minimum: -1000000000
                        maximum: 1000000000
                      dims:
                        type: object
                        properties:
                          outcome:
                            type: string
                            enum:
                              - Granted
                              - AlreadyOwned
                              - TooPoor
                              - UnknownItem
                              - Unavailable
                          itemId:
                            type: string
                            enum:
                              - RedHat
                              - GoldCrown
                          state:
                            type: string
                            enum:
                              - Closed
                              - Open
                              - HalfOpen
                          packet:
                            type: string
                            enum:
                              - Orb.Collect
                              - Profile.RequestSnapshot
                              - Profile.Snapshot
                              - Shop.Buy
                              - Shop.Result
                              - Unknown
                          reason:
                            type: string
                            enum:
                              - UnknownPacket
                              - WrongDirection
                              - NoHandler
                              - TooManyArguments
                              - Throttled
                              - BadPayload
                        additionalProperties: false
                    required:
                      - name
                      - ts
                    additionalProperties: false
              required:
                - events
              additionalProperties: false
      security:
        - bearer: []
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  dropped:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - accepted
                  - dropped
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
